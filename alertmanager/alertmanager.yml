global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'

  routes:
    - match:
        severity: critical
      receiver: 'default-webhook'
      repeat_interval: 1h

receivers:
  # Default receiver logs alerts to Alertmanager UI (localhost:9093)
  # No external notification — add a webhook, email, or Slack receiver below
  - name: 'default-webhook'

  # Uncomment and configure to enable email alerts:
  # - name: 'email'
  #   email_configs:
  #     - to: 'your-email@example.com'
  #       from: 'alertmanager@isp-monitor.local'
  #       smarthost: 'smtp.gmail.com:587'
  #       auth_username: 'your-email@gmail.com'
  #       auth_password: 'your-app-password'
  #       auth_identity: 'your-email@gmail.com'

  # Uncomment and configure to enable Slack alerts:
  # - name: 'slack'
  #   slack_configs:
  #     - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
  #       channel: '#isp-alerts'
  #       title: '{{ .GroupLabels.alertname }}'
  #       text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
